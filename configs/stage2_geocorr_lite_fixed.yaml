# Stage 2: add GeoCorr Lite geometry energy with a small FIXED residual scale
# (no learned gate yet). Advance to Stage 3 when the correction shows the correct
# sign and cue behavior (docs/baseline_recovery_plan.md).
stage_name: stage2_geocorr_lite_fixed
output_root: runs

model:
  backbone:
    in_channels: 3
    geometry_channels: 4
    base_channels: 32
    use_ggf_residual: true
    ggf_stage_index: 0
  geocorr:
    enabled: true
    use_learned_gate: false        # fixed scale for Stage 2
    use_extended_cues: false       # base 6 cues only; occlusion/camera-angle deferred
    score_convention: higher_is_better
    fixed_residual_scale: 0.02
    apply_stages: [fine, mid]      # later cascade stages first

data:
  root: /home/gobika/Research_Gobika/geofusionnet_geocorr/data/DTU
  gt_root: /home/gobika/Research_Gobika/dtu_groundtruth
  n_views: 5
  img_wh: [640, 512]
  num_depth: 192
  depth_interval: 2.65
  num_workers: 4
  geometry_prior: mono_sparse     # metric mono+sparse prior G (scripts/anchor_mono_prior.py)

training:
  batch_size: 2
  lr: 0.001
  max_steps: 20000
  max_epochs: 16
  log_every: 50
  ckpt_every: 2000

alpha_schedule:
  warmup_steps: 2000
  ramp_steps: 8000
  alpha_max: 1.0

loss:
  type: compact_self_supervised   # unchanged from Stage 0/1
  use_geo_term: true              # L_geo is part of GeoFusionNet's published objective
  geo_weight: 0.5
  geo_weight: 0.5

eval:
  # Published DTU numbers (and GeoMVSNet's test.py) use the full-res dtu-test images:
  # 1600x1200 resized to the multiple-of-64 fit 1600x1152. Training stays at 640x512.
  test_data:
    root: /home/gobika/Research_Gobika/GeoFusionNet/datasets/dtu-test-1200
    layout: test
    img_wh: [1600, 1152]
    prior_root: /home/gobika/Research_Gobika/geofusionnet_geocorr/data/DTU_test/MonoPrior

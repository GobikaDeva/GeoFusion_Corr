# Stage 0: the frozen baseline (2026-09-27) = configs/ablations/A0f_fixes_only_short.yaml,
# written out long-form. No GeoCorr, no GGF residual. The two files must stay identical
# (tests/test_stage0_config.py); stage_name is A0f's so both point at the same runs.
# Chain per seed N (NOTES.md):
#   A0_baseline seedN          20k steps, constant lr 1e-3, pre-fix cost volume
#   A0_finetune_clmvs seedN    6k steps, CL-MVSNet LR recipe
#   this config seedN          1500 steps with the cost-volume fixes
# Official numbers: scripts/eval_stage0_a0f.sh (1600x1152, 22 scans, 3 seeds) ->
# runs/A0f_fixes_only_short/aggregated_1600x1152.json, the --baseline_stats for later stages.
stage_name: A0f_fixes_only_short
output_root: runs

model:
  backbone:
    in_channels: 3
    geometry_channels: 4
    base_channels: 32
    use_ggf_residual: false
    # Cost-volume bug fixes (2026-09-25), baseline corrections rather than research
    # contributions: drop out-of-view source samples from the variance instead of
    # counting zero-padded features, and replace the stride-2 ConvTranspose3d
    # (sawtooth probabilities) with trilinear upsampling + conv. Checkpoints trained
    # before this (runs/A0_baseline) need both flags off to load/evaluate.
    mask_out_of_view: true
    reg_upsample: trilinear
  geocorr:
    enabled: false

data:
  root: /home/gobika/Research_Gobika/geofusionnet_geocorr/data/DTU
  gt_root: /home/gobika/Research_Gobika/dtu_groundtruth
  n_views: 5                      # match the reference GeoMVS protocol exactly
  img_wh: [640, 512]
  num_depth: 192
  depth_interval: 2.65
  num_workers: 6
  geometry_prior: mono_sparse     # metric mono+sparse prior G (scripts/anchor_mono_prior.py)
  lighting_conditions: [0, 1, 2, 3, 4, 5, 6]

training:
  init_from: runs/A0_finetune_clmvs/seed{seed}/ckpt_final.pt   # regularizer `up` layers start fresh
  batch_size: 2
  grad_accum_steps: 2             # effective batch 4
  lr: 0.0005
  warmup_steps: 100
  max_steps: 1500
  max_epochs: 1000
  log_every: 50
  ckpt_every: 500
  val_every: 500                  # DTU val split (18 scans x 49 views, lighting 3)
  val_view_stride: 1

loss:
  type: compact_self_supervised   # models/losses.py::compact_self_supervised_loss
  use_geo_term: true              # L_geo is part of GeoFusionNet's published objective
  geo_weight: 0.5
  consistency:
    enabled: false                # CL-MVSNet ICC+SCC: no gain over this control (NOTES.md)

eval:
  # Published DTU numbers (and GeoMVSNet's test.py) use the full-res dtu-test images:
  # 1600x1200 resized to the multiple-of-64 fit 1600x1152. Training stays at 640x512.
  test_data:
    root: /home/gobika/Research_Gobika/GeoFusionNet/datasets/dtu-test-1200
    layout: test
    img_wh: [1600, 1152]
    prior_root: /home/gobika/Research_Gobika/geofusionnet_geocorr/data/DTU_test/MonoPrior

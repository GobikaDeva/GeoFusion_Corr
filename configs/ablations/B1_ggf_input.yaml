# B1: geometry as a network input. A0f (frozen Stage 0) + the GGF residual at the coarse
# feature level (ggf_stage_index 0), fine-tuned from A0f's final checkpoint with A0f's
# own recipe (1500 steps, lr 5e-4, 100-step warmup, consistency off).
# The GGF residual's last conv is zero-initialized, so before training the forward pass
# is bit-identical to A0f (tests/test_ggf_identity.py). GGF fuses into the REFERENCE
# view's features only; source features stay RGB-only.
# Note: B1 sees 1500 steps more than A0f in total; the matched control is A0f continued
# for 1500 steps with use_ggf_residual: false.
stage_name: B1_ggf_input
output_root: runs
model:
  backbone: {in_channels: 3, geometry_channels: 4, base_channels: 32, use_ggf_residual: true, ggf_stage_index: 0,
             mask_out_of_view: true, reg_upsample: trilinear}
  geocorr: {enabled: false}
data: {root: /home/gobika/Research_Gobika/geofusionnet_geocorr/data/DTU, gt_root: /home/gobika/Research_Gobika/dtu_groundtruth, n_views: 5, img_wh: [640, 512], num_depth: 192, depth_interval: 2.65, num_workers: 6, geometry_prior: mono_sparse,
       lighting_conditions: [0, 1, 2, 3, 4, 5, 6]}
training:
  init_from: runs/A0f_fixes_only_short/seed{seed}/ckpt_final.pt
  init_new_modules: [backbone.ggf_fusion.]   # absent from A0f; keeps its zero init
  batch_size: 2
  grad_accum_steps: 2
  lr: 0.0005
  warmup_steps: 100
  max_steps: 1500
  max_epochs: 1000
  log_every: 50
  ckpt_every: 500
  val_every: 500
  val_view_stride: 1
loss:
  type: compact_self_supervised
  use_geo_term: true
  geo_weight: 0.5
  consistency:
    enabled: false
# Published DTU numbers (and GeoMVSNet's test.py) use the full-res dtu-test images:
# 1600x1200 resized to the multiple-of-64 fit 1600x1152. Training stays at 640x512.
eval: {test_data: {root: /home/gobika/Research_Gobika/GeoFusionNet/datasets/dtu-test-1200, layout: test, img_wh: [1600, 1152], prior_root: /home/gobika/Research_Gobika/geofusionnet_geocorr/data/DTU_test/MonoPrior}}

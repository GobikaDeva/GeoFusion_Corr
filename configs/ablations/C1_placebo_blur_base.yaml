# C1_placebo_blur_base (2026-10-11, prepared, not run): B2_capacity_base.yaml with a placebo prior as the L_geo
# target, train split only (patches/C1_placebo.patch: data.prior_placebo). G Gaussian-blurred, sigma 24 px at the cached 320x256 prior (48 px at 640x512); median |X-GT| 18.2 mm vs G's 10.7 mm on a 49-view train sample.
# Same loss and weight (geo_weight 0.5); model never reads ref_geom (no GGF). Every other
# setting is identical; only stage_name, init_from and data.prior_placebo differ.
# Chain: C1_placebo_blur_base -> C1_placebo_blur_finetune -> C1_placebo_blur.
# B2_capacity phase 1/3 (2026-10-06, Test 2): A0_baseline's recipe (20k steps, lr 1e-3, from
# scratch) on the larger model. Only model.backbone and stage_name differ from A0_baseline.
# The architecture is fixed across all three phases, so the A0f cost-volume fixes
# (mask_out_of_view, trilinear) are on from step 0 here; in the A0f chain they are only
# switched on in phase 3. Chain: this -> B2_capacity_finetune -> B2_capacity.
stage_name: C1_placebo_blur_base
output_root: runs
model:
  backbone: {in_channels: 3, geometry_channels: 4, base_channels: 32, use_ggf_residual: false,
             mask_out_of_view: true, reg_upsample: trilinear,
             encoder: fpn, fpn_widths: [32, 96, 192], fpn_inner: 64, cost_groups: 8, reg_base_channels: 16, reg_levels: 2}
  geocorr: {enabled: false}
data: {root: /home/gobika/Research_Gobika/geofusionnet_geocorr/data/DTU, gt_root: /home/gobika/Research_Gobika/dtu_groundtruth, n_views: 5, img_wh: [640, 512], num_depth: 192, depth_interval: 2.65, num_workers: 4, geometry_prior: mono_sparse, prior_placebo: {type: blur, sigma_px: 24}}
training: {batch_size: 2, lr: 0.001, max_steps: 20000, max_epochs: 16, log_every: 50, ckpt_every: 2000}
loss: {type: compact_self_supervised, use_geo_term: true, geo_weight: 0.5}
# Published DTU numbers (and GeoMVSNet's test.py) use the full-res dtu-test images:
# 1600x1200 resized to the multiple-of-64 fit 1600x1152. Training stays at 640x512.
eval: {test_data: {root: /home/gobika/Research_Gobika/GeoFusionNet/datasets/dtu-test-1200, layout: test, img_wh: [1600, 1152], prior_root: /home/gobika/Research_Gobika/geofusionnet_geocorr/data/DTU_test/MonoPrior}}

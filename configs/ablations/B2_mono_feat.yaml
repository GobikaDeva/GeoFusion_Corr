# B2_mono_feat (2026-10-09): B2 + frozen Depth-Anything-V2-Small features of the reference
# image added to the reference encoder features (models/geofusionnet.py
# MonoFeatureInjection), self-supervised, with no prior depth input and no L_geo.
# Phase-3 recipe of B2_nogeo.yaml from the same init (B2_nogeo_finetune/seed{seed}), so
# B2_nogeo/seed{seed} is the matched control: the only differences are the zero-initialized
# injection (identical to B2 at step 0, tests/test_mono_feat_identity.py),
# data.geometry_prior: none and use_geo_term: false. B2 never reads ref_geom (no GGF) and
# B2_nogeo has geo_weight 0, so neither of those two changes alters the computation.
# Injected at coarse (1/4) and mid (1/2): the fused DPT map is 296x368 at 518x644 input,
# i.e. about mid resolution; fine (full res) would only get an upsampled copy.
stage_name: B2_mono_feat
output_root: runs
model:
  backbone: {in_channels: 3, geometry_channels: 4, base_channels: 32, use_ggf_residual: false,
             mask_out_of_view: true, reg_upsample: trilinear,
             encoder: fpn, fpn_widths: [32, 96, 192], fpn_inner: 64, cost_groups: 8, reg_base_channels: 16, reg_levels: 2,
             mono_features: true, mono_model_id: depth-anything/Depth-Anything-V2-Small-hf,
             mono_feat_stages: [coarse, mid], mono_input_h: 518, mono_fp16: true}
  geocorr: {enabled: false}
data: {root: /home/gobika/Research_Gobika/geofusionnet_geocorr/data/DTU, gt_root: /home/gobika/Research_Gobika/dtu_groundtruth, n_views: 5, img_wh: [640, 512], num_depth: 192, depth_interval: 2.65, num_workers: 6, geometry_prior: none,
       lighting_conditions: [0, 1, 2, 3, 4, 5, 6]}
training:
  init_from: runs/B2_nogeo_finetune/seed{seed}/ckpt_final.pt
  init_new_modules: [backbone.mono_injection.]
  batch_size: 2
  grad_accum_steps: 2
  lr: 0.0005
  warmup_steps: 100
  max_steps: 1500
  max_epochs: 1000
  log_every: 50
  ckpt_every: 500
  val_every: 500
  val_view_stride: 1
loss:
  type: compact_self_supervised
  use_geo_term: false
  geo_weight: 0.0
  consistency:
    enabled: false
# Published DTU numbers (and GeoMVSNet's test.py) use the full-res dtu-test images:
# 1600x1200 resized to the multiple-of-64 fit 1600x1152. Training stays at 640x512.
# No prior_root: geometry_prior none needs no prior files at test time either.
eval: {test_data: {root: /home/gobika/Research_Gobika/GeoFusionNet/datasets/dtu-test-1200, layout: test, img_wh: [1600, 1152]}}
